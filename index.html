<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#112a46">
  <meta name="description" content="매일 한 문장씩 듣고 따라 하는 기초 영어 회화">
  <title>하루 한 문장 영어</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23ffce58'/%3E%3Cpath d='M17 18h30v23H31l-10 8v-8h-4z' fill='%23112a46'/%3E%3Cpath d='M25 27h14M25 33h10' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#112a46;--ink:#17304a;--muted:#66788b;--yellow:#ffce58;--cream:#fffaf0;--line:#dfe6eb;--white:#fff;--green:#1b7f65;--shadow:0 20px 55px rgba(17,42,70,.13)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(140deg,#f7fbff 0%,var(--cream) 52%,#fff3cf 100%);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
    body:before{content:"";position:fixed;width:28rem;height:28rem;border:1px solid rgba(17,42,70,.07);border-radius:50%;right:-9rem;top:-9rem;box-shadow:0 0 0 5rem rgba(255,206,88,.08),0 0 0 10rem rgba(255,206,88,.04);pointer-events:none}
    .shell{width:min(1060px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}.brand{display:flex;gap:11px;align-items:center;font-weight:900;color:var(--navy);letter-spacing:-.04em}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--yellow);font-size:20px}.streak{font-size:.86rem;font-weight:800;padding:9px 13px;background:#fff;border:1px solid var(--line);border-radius:999px}
    main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.7fr);gap:22px}.hero,.examples{background:rgba(255,255,255,.9);border:1px solid rgba(217,226,233,.9);border-radius:28px;box-shadow:var(--shadow)}.hero{padding:42px}.date{display:inline-flex;align-items:center;gap:8px;border:0;background:#eaf6f2;padding:9px 12px;border-radius:11px;font:inherit;font-size:.84rem;font-weight:850;color:var(--green);cursor:pointer}.date:hover{background:#dff0ea}.eyebrow{display:block;width:max-content;margin:25px 0 14px;padding:6px 10px;border-radius:8px;background:#fff0bd;color:#6b5000;font-size:.75rem;font-weight:900}.phrase{margin:0;max-width:720px;font-family:Georgia,serif;font-size:clamp(2.35rem,6vw,4.7rem);line-height:1.03;letter-spacing:-.05em;color:var(--navy)}.meaning{font-size:1.18rem;margin:17px 0 30px;color:#51677c}.listen{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--navy);color:white;font:inherit;font-weight:850;padding:15px 19px;border-radius:14px;cursor:pointer;box-shadow:0 8px 20px rgba(17,42,70,.2)}.listen:hover{transform:translateY(-1px)}.listen:focus-visible,.mini:focus-visible,.done:focus-visible,.date:focus-visible,.cal-day:focus-visible,.cal-nav:focus-visible,.close:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}.listen.playing{background:var(--green)}.tip{display:flex;gap:10px;margin-top:34px;padding-top:22px;border-top:1px dashed var(--line);color:var(--muted);font-size:.91rem;line-height:1.6}
    .side{display:flex;flex-direction:column;gap:22px}.examples{padding:26px}.examples h2{margin:0 0 18px;font-size:1rem;color:var(--navy)}.example{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}.example:first-of-type{border-top:0}.mini{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#f8fafb;color:var(--navy);cursor:pointer;font-size:1rem}.example p{margin:0;font-size:.96rem;line-height:1.45}.example small{display:block;margin-top:5px;color:var(--muted);font-size:.82rem}.progress{padding:22px;border-radius:24px;background:var(--navy);color:white}.progress p{margin:0 0 13px;font-size:.9rem;color:#bed0df}.done{width:100%;border:0;border-radius:13px;padding:13px;background:var(--yellow);color:var(--navy);font:inherit;font-weight:900;cursor:pointer}.done.completed{background:#c9f0df;color:#145b48}.status{min-height:1.4em;margin-top:10px!important;font-size:.78rem!important;color:#d8e5ef!important;text-align:center}
    dialog{width:min(92vw,460px);border:0;border-radius:25px;padding:0;box-shadow:0 30px 90px rgba(17,42,70,.28);color:var(--ink)}dialog::backdrop{background:rgba(12,29,47,.52);backdrop-filter:blur(4px)}.calendar{padding:25px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.cal-title{font-size:1.15rem;font-weight:900;color:var(--navy)}.cal-actions{display:flex;gap:7px}.cal-nav,.close{width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:11px;cursor:pointer;font-size:1rem}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week span{text-align:center;color:var(--muted);font-size:.75rem;font-weight:800;padding-bottom:6px}.cal-day{position:relative;aspect-ratio:1;border:0;background:#f6f8fa;border-radius:11px;color:var(--ink);font:inherit;font-weight:750;cursor:pointer}.cal-day:hover{background:#eaf6f2}.cal-day.today{box-shadow:inset 0 0 0 2px var(--green)}.cal-day.selected{background:var(--navy);color:white}.cal-day.learned:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--yellow);bottom:6px;left:calc(50% - 3px)}.cal-day:disabled{opacity:.28;cursor:not-allowed}.cal-day.empty{visibility:hidden}.cal-note{margin:17px 0 0;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;line-height:1.5}.return{margin-left:8px;border:0;background:transparent;color:var(--green);font:inherit;font-size:.85rem;font-weight:850;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.hidden{display:none}
    @media(max-width:780px){.shell{padding-top:18px}.top{margin-bottom:20px}main{grid-template-columns:1fr}.hero{padding:29px 24px}.phrase{font-size:clamp(2.5rem,12vw,4rem)}.streak{font-size:.75rem}.brand span:last-child{font-size:.93rem}.examples{padding:22px}.calendar{padding:20px}.cal-day{border-radius:9px}}
    @media(prefers-reduced-motion:no-preference){.listen,.mini,.done{transition:.18s ease}.hero,.examples,.progress{animation:rise .5s ease both}.side{animation-delay:.08s}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand"><span class="logo">A</span><span>하루 한 문장 영어</span></div><div class="streak" id="streak">오늘도 가볍게 시작해요</div></header>
    <main>
      <section class="hero" aria-labelledby="phrase"><button class="date" id="date" type="button" aria-haspopup="dialog"><span aria-hidden="true">▣</span><span id="dateText"></span></button><button class="return hidden" id="returnToday" type="button">오늘로 돌아가기</button><div class="eyebrow" id="label">TODAY'S PHRASE</div><h1 class="phrase" id="phrase"></h1><p class="meaning" id="meaning"></p><button class="listen" id="listen" type="button"><span aria-hidden="true">▶</span><span>원어민 발음 듣기</span></button><div class="tip"><span aria-hidden="true">💡</span><span id="tip"></span></div></section>
      <aside class="side"><section class="examples"><h2>이렇게도 말해 보세요</h2><div id="examples"></div></section><section class="progress"><p>소리 내어 3번 따라 읽었나요?</p><button class="done" id="done" type="button">오늘 학습 완료</button><p class="status" id="status" aria-live="polite"></p></section></aside>
    </main>
    <dialog id="calendarDialog" aria-labelledby="calendarTitle"><div class="calendar"><div class="cal-head"><button class="cal-nav" id="prevMonth" type="button" aria-label="이전 달">‹</button><div class="cal-title" id="calendarTitle"></div><div class="cal-actions"><button class="cal-nav" id="nextMonth" type="button" aria-label="다음 달">›</button><button class="close" id="closeCalendar" type="button" aria-label="달력 닫기">×</button></div></div><div class="week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="calendarDays"></div><p class="cal-note"><strong>노란 점</strong>은 학습을 완료한 날이에요. 날짜를 눌러 그날의 문장을 다시 확인하세요.</p></div></dialog>
  </div>
  <script>
  const lessons=[
    ["How's it going?","어떻게 지내세요?","가까운 사이에서 안부를 자연스럽게 묻는 표현이에요.",[["How's it going at work?","직장 생활은 어때요?"],["Hey, how's it going?","안녕, 어떻게 지내?"],["How's everything going?","모든 일이 잘 되어 가나요?"]]],
    ["Could you help me?","도와주실 수 있나요?","정중하게 도움을 요청할 때 쓰세요.",[["Could you help me with this bag?","이 가방 좀 도와주실래요?"],["Could you help me find the station?","역 찾는 것을 도와주실래요?"],["Could you help me for a minute?","잠깐 도와주실 수 있나요?"]]],
    ["I'd like a coffee, please.","커피 한 잔 주세요.","가게나 식당에서 원하는 것을 공손하게 주문하는 표현이에요.",[["I'd like a table for two, please.","두 명 자리 부탁드립니다."],["I'd like some water, please.","물 좀 주세요."],["I'd like to order now, please.","지금 주문할게요."]]],
    ["What do you recommend?","무엇을 추천하시나요?","메뉴나 상품을 고를 때 유용한 만능 질문이에요.",[["What do you recommend here?","여기서는 무엇을 추천하시나요?"],["Which one do you recommend?","어느 것을 추천하시나요?"],["Can you recommend something popular?","인기 있는 것을 추천해 주실래요?"]]],
    ["I'm on my way.","지금 가는 중이에요.","약속 장소로 출발했거나 이동 중일 때 말해 보세요.",[["I'm on my way home.","집에 가는 중이에요."],["I'm on my way to the office.","회사에 가는 중이에요."],["Don't worry. I'm on my way.","걱정 마세요. 지금 가고 있어요."]]],
    ["Take your time.","천천히 하세요.","상대에게 서두르지 않아도 된다고 안심시키는 표현이에요.",[["Take your time choosing.","천천히 고르세요."],["There's no rush. Take your time.","급할 것 없어요. 천천히 하세요."],["Take your time and think about it.","천천히 생각해 보세요."]]],
    ["That sounds great.","그거 좋겠네요.","상대의 제안에 긍정적으로 답할 때 자연스러워요.",[["Dinner at seven? That sounds great.","7시에 저녁 어때요? 좋네요."],["Your plan sounds great.","당신의 계획이 아주 좋아 보여요."],["That sounds great to me.","저는 그거 좋습니다."]]],
    ["I'll think about it.","생각해 볼게요.","바로 결정하기 어려울 때 부드럽게 시간을 벌 수 있어요.",[["Thanks. I'll think about it.","고마워요. 생각해 볼게요."],["I'll think about it tonight.","오늘 밤 생각해 볼게요."],["Let me think about it first.","먼저 생각 좀 해 볼게요."]]],
    ["Can I get this to go?","이거 포장해 주실 수 있나요?","음식이나 음료를 포장하고 싶을 때 쓰는 표현이에요.",[["Can I get the rest to go?","남은 것을 포장해 주실래요?"],["I'd like this to go, please.","이것은 포장해 주세요."],["Is this for here or to go?","드시고 가시나요, 포장인가요?"]]],
    ["What time does it start?","몇 시에 시작하나요?","일정이나 공연의 시작 시간을 확인할 때 써 보세요.",[["What time does the movie start?","영화가 몇 시에 시작하나요?"],["What time does class start?","수업이 몇 시에 시작하나요?"],["Do you know what time it starts?","몇 시에 시작하는지 아세요?"]]],
    ["I'm looking for this address.","이 주소를 찾고 있어요.","길을 물을 때 주소를 보여 주며 쓰기 좋은 표현이에요.",[["I'm looking for the subway station.","지하철역을 찾고 있어요."],["I'm looking for a pharmacy.","약국을 찾고 있어요."],["Could you help me find this address?","이 주소 찾는 것을 도와주실래요?"]]],
    ["Could you say that again?","다시 말씀해 주시겠어요?","잘 듣지 못했을 때 당황하지 말고 사용해 보세요.",[["Sorry, could you say that again?","죄송하지만 다시 말씀해 주시겠어요?"],["Could you say that more slowly?","좀 더 천천히 말씀해 주시겠어요?"],["Could you repeat the last part?","마지막 부분을 다시 말해 주시겠어요?"]]],
    ["I'm just looking, thanks.","그냥 둘러보는 중이에요, 감사합니다.","매장에서 직원의 도움을 정중히 사양할 때 유용해요.",[["I'm just browsing, thank you.","그냥 구경하는 중이에요, 감사합니다."],["I'm just looking for now.","지금은 그냥 둘러보고 있어요."],["Thanks, but I'm just looking.","감사하지만 그냥 보고 있어요."]]],
    ["Do you have any plans?","계획 있으세요?","주말이나 휴일 계획을 가볍게 물을 때 쓰세요.",[["Do you have any plans for tonight?","오늘 밤 계획 있으세요?"],["Do you have any plans this weekend?","이번 주말에 계획 있으세요?"],["I don't have any plans yet.","아직 아무 계획 없어요."]]],
    ["It was nice meeting you.","만나서 반가웠어요.","처음 만난 사람과 헤어질 때 따뜻하게 마무리하는 표현이에요.",[["It was really nice meeting you.","정말 만나서 반가웠어요."],["It was nice talking with you.","이야기 나눠서 좋았어요."],["Nice meeting you, too.","저도 만나서 반가웠어요."]]],
    ["Can I try this on?","이거 입어 봐도 될까요?","옷이나 신발을 구매하기 전에 착용해 보고 싶을 때 쓰세요.",[["Where can I try this on?","어디에서 입어 볼 수 있나요?"],["Can I try these shoes on?","이 신발을 신어 봐도 될까요?"],["I'd like to try this on.","이것을 입어 보고 싶어요."]]],
    ["I'm running a little late.","조금 늦고 있어요.","약속 시간에 늦을 것 같을 때 미리 알려 주세요.",[["Sorry, I'm running late.","미안해요, 늦고 있어요."],["I'm running about ten minutes late.","10분 정도 늦을 것 같아요."],["The bus is late, so I'm running late.","버스가 늦어서 저도 늦고 있어요."]]],
    ["Would you like some?","좀 드실래요?","음식이나 음료를 상대에게 권할 때 자연스러운 표현이에요.",[["Would you like some coffee?","커피 좀 드실래요?"],["Would you like some more?","좀 더 드실래요?"],["No thanks, I'm full.","괜찮아요, 배불러요."]]],
    ["Let me check.","제가 확인해 볼게요.","정보가 확실하지 않을 때 확인 후 답하겠다는 표현이에요.",[["Let me check my schedule.","제 일정을 확인해 볼게요."],["Let me check the price.","가격을 확인해 볼게요."],["Let me check and get back to you.","확인하고 다시 알려 드릴게요."]]],
    ["No worries.","괜찮아요.","사과나 감사에 편안하게 응답할 때 자주 써요.",[["No worries, it happens.","괜찮아요, 그럴 수 있죠."],["No worries at all.","전혀 걱정하지 마세요."],["Thanks! — No worries.","고마워요! — 괜찮아요."]]],
    ["Could I have the check, please?","계산서 주세요.","식당에서 계산을 요청할 때 쓰는 공손한 표현이에요.",[["Could we have the check, please?","계산서 좀 주시겠어요?"],["Can I pay by card?","카드로 결제해도 되나요?"],["Is service included?","서비스 요금이 포함되어 있나요?"]]]
  ];
  const today=new Date();today.setHours(0,0,0,0);const start=new Date(2026,0,1),fmt=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}),done=document.querySelector('#done'),status=document.querySelector('#status');let selected=new Date(today),viewMonth=new Date(today.getFullYear(),today.getMonth(),1),currentLesson,activeUtterance=null,cachedVoices=[];
  function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function lessonFor(d){const n=Math.floor((d-start)/86400000);return lessons[((n%lessons.length)+lessons.length)%lessons.length]}
  function renderLesson(){currentLesson=lessonFor(selected);document.querySelector('#dateText').textContent=fmt.format(selected);document.querySelector('#phrase').textContent=currentLesson[0];document.querySelector('#meaning').textContent=currentLesson[1];document.querySelector('#tip').textContent=currentLesson[2];document.querySelector('#label').textContent=selected.getTime()===today.getTime()?"TODAY'S PHRASE":"PAST PHRASE";document.querySelector('#returnToday').classList.toggle('hidden',selected.getTime()===today.getTime());document.querySelector('#examples').innerHTML=currentLesson[3].map((x,i)=>`<div class="example"><button class="mini" data-say="${x[0].replaceAll('"','&quot;')}" aria-label="예문 ${i+1} 듣기">▶</button><p>${x[0]}<small>${x[1]}</small></p></div>`).join('');document.querySelectorAll('.mini').forEach(b=>b.onclick=()=>speak(b.dataset.say,b));const learned=localStorage.getItem(`daily-english-${iso(selected)}`);done.classList.toggle('completed',!!learned);done.disabled=selected.getTime()!==today.getTime();done.textContent=learned?'학습 완료 ✓':selected.getTime()===today.getTime()?'오늘 학습 완료':'지난 학습 문장';status.textContent=''}
  function refreshVoices(){cachedVoices=window.speechSynthesis.getVoices()}
  if('speechSynthesis' in window){refreshVoices();window.speechSynthesis.addEventListener('voiceschanged',refreshVoices)}
  function speak(text,button){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){status.textContent='이 브라우저에서는 음성 재생을 지원하지 않아요.';return}const synth=window.speechSynthesis;synth.cancel();if(synth.paused)synth.resume();const u=new SpeechSynthesisUtterance(text);activeUtterance=u;u.lang='en-US';u.rate=.86;const voices=synth.getVoices().length?synth.getVoices():cachedVoices;u.voice=voices.find(v=>v.lang==='en-US'&&/Samantha|Google US English|Microsoft Aria|Natural/i.test(v.name))||voices.find(v=>v.lang.startsWith('en-US'))||voices.find(v=>v.lang.startsWith('en'))||null;if(button)button.classList.add('playing');u.onstart=()=>{status.textContent=''};u.onend=()=>{if(button)button.classList.remove('playing');activeUtterance=null};u.onerror=e=>{if(button)button.classList.remove('playing');activeUtterance=null;if(!['canceled','interrupted'].includes(e.error))status.textContent='소리를 재생하지 못했어요. 휴대폰의 소리 크기와 무음 모드를 확인한 뒤 다시 눌러 주세요.'};synth.speak(u);setTimeout(()=>{if(synth.paused)synth.resume()},100)}
  document.querySelector('#listen').onclick=e=>speak(currentLesson[0],e.currentTarget);done.onclick=()=>{localStorage.setItem(`daily-english-${iso(today)}`,'1');renderLesson();status.textContent='잘했어요! 달력에 오늘의 학습이 기록됐어요.';document.querySelector('#streak').textContent='오늘의 학습을 마쳤어요';renderCalendar()};
  const dialog=document.querySelector('#calendarDialog'),days=document.querySelector('#calendarDays');function renderCalendar(){document.querySelector('#calendarTitle').textContent=`${viewMonth.getFullYear()}년 ${viewMonth.getMonth()+1}월`;days.innerHTML='';const first=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1),last=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,0);for(let i=0;i<first.getDay();i++){const e=document.createElement('button');e.className='cal-day empty';e.tabIndex=-1;days.append(e)}for(let n=1;n<=last.getDate();n++){const d=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),n),b=document.createElement('button');b.className='cal-day';b.textContent=n;b.type='button';b.disabled=d>today;if(d.getTime()===today.getTime())b.classList.add('today');if(d.getTime()===selected.getTime())b.classList.add('selected');if(localStorage.getItem(`daily-english-${iso(d)}`))b.classList.add('learned');b.setAttribute('aria-label',`${d.getMonth()+1}월 ${n}일 문장 보기`);b.onclick=()=>{selected=d;renderLesson();dialog.close()};days.append(b)}document.querySelector('#nextMonth').disabled=viewMonth.getFullYear()===today.getFullYear()&&viewMonth.getMonth()===today.getMonth()}
  document.querySelector('#date').onclick=()=>{viewMonth=new Date(selected.getFullYear(),selected.getMonth(),1);renderCalendar();dialog.showModal()};document.querySelector('#closeCalendar').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};document.querySelector('#prevMonth').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);renderCalendar()};document.querySelector('#nextMonth').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);renderCalendar()};document.querySelector('#returnToday').onclick=()=>{selected=new Date(today);renderLesson()};
  if(localStorage.getItem(`daily-english-${iso(today)}`))document.querySelector('#streak').textContent='오늘의 학습을 마쳤어요';renderLesson();
  </script>
